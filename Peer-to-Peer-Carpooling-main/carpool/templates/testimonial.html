{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href='https://fonts.googleapis.com/css?family=Kalam' rel='stylesheet'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <title>Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'styles/page.css'%}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/home.css'%}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/calendar.css'%}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Additional Calendar-specific styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

 </head>

<style>
    .title-header {
        text-align: center;
        width: 80%;
        color: #50a0bb;
        margin-top: 10px;
        justify-content: center;
    }
    
    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #fff;
        padding-top: 20px; /* Ensure there's space above the container content */
    }
    body {
        margin: 0;
        padding-top: 70px; /* Adjust based on the total height of fixed elements */
    }
</style>

<body>
    <div class="full-view">
        <div class="topnav">
            <div id="name">
                <h1>Title</h1>
            </div>
            <div>
            <ul id="rest">
                {% if user.is_authenticated %}
                <li><a href="{% url 'home' %}" class="active">Home</a></li>
                <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'logout' %}">Logout</a></li>
                {% endif %}
            </ul>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
    
    
    <div class="page-content">
        <div class="vertical-nav" id="vertical-nav">
            <a href="{% url 'bookings' %}" id="bookings-link">Bookings</a>
            <a href="{% url 'calendar' %}" id="calendar-link">Calendar</a>
            <a href="{% url 'service' %}" id="service-link">Service</a>
            <a href="{% url 'testimonial' %}" id="testimonial-link">Testimonial</a>
        </div>
        <div class="content">
            <div id="title-header" class="title-header">
                <h1>Testimonial</h1>
            </div>
        
            <div class="container" id="container">
                    <!-- Your testimonial content goes here -->
            </div>
        </div>
        
    </div>

    <script>


        document.addEventListener("DOMContentLoaded", function() {
        const toggleButton = document.querySelector(".menu-toggle");
        const verticalNav = document.querySelector(".vertical-nav");
        
        toggleButton.addEventListener("click", function() {
            verticalNav.classList.toggle("active");
            calendarContainer.classList.toggle("menu-active");
            selectedSchedule.classList.toggle("menu-active");
        });
    });
    </script>     

</body>
</html>
